name: CI

# Pull requests only: the repository is private, so every run costs minutes.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Bundled plugin is up to date
        # Plugins install from git with no build step, so the committed dist/ must match the source.
        run: |
          npm run build
          git diff --exit-code -- packages/claude-code/dist || {
            echo "::error::packages/claude-code/dist is stale: run npm run build and commit dist/"
            exit 1
          }
